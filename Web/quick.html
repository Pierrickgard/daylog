<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="quick">
  <div id="box" class="quick-box">
    <div class="quick-top">
      <div class="segmented" id="kinds"></div>
      <span class="quick-esc"><kbd>esc</kbd></span>
    </div>
    <div class="chips" id="sections"></div>
    <input id="input" class="quick-input" autocomplete="off" spellcheck="true">
    <div class="quick-hints" id="hints"></div>
  </div>
  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="quick.js"></script>
</body>
</html>
