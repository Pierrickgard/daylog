name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Daylog.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) export VERSION ;; esac
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/Daylog.app build/Daylog.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Daylog
          path: build/Daylog.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Daylog.zip --generate-notes
