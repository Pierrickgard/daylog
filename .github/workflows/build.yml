name: Build

on:
  push:
    branches: [main]
  pull_request:

# Releases are built and signed on the maintainer's Mac (scripts/release.sh), never here:
# CI has no access to the update signing key.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Daylog.app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --norsrc --noextattr --keepParent build/Daylog.app build/Daylog.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Daylog
          path: build/Daylog.zip
