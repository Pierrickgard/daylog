name: Build

on:
  push:
    branches: [main]
  pull_request:

# Releases are built and signed on the maintainer's Mac (scripts/release.sh), never here:
# CI has no access to the update signing key.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Daylog.app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/Daylog.app build/Daylog.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Daylog
          path: build/Daylog.zip
